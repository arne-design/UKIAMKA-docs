<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>UKIAMKA digital documents Library – Admin</title>
    <style>
      /* Kompakt layout for skjemafeltene i Decap CMS */
      [class*="ControlContainer"] {
        margin-top: 12px !important;
      }

      /* Gjør input-felt og nedtrekkslister lavere og nettere */
      #nc-root input[type="text"],
      #nc-root select,
      [class*="Select-control"],
      [class*="DropdownList"] {
        min-height: 35px !important;
        height: 35px !important;
        padding: 4px 10px !important;
        font-size: 0.7rem !important;
      }

      /* Reduser høyden på tekstboksen (Short Summary) */
      #nc-root textarea {
        min-height: 35px !important;
        height: 35px !important;
        padding: 8px 10px !important;
        font-size: 0.7rem !important;
      }

      /* Gjør etikettene (TITLE, LANGUAGE osv.) litt nettere */
      [class*="FieldLabel"] {
        font-size: 0.7rem !important;
        padding: 2px 6px !important;
      }

      /* Stram inn filopplastingsboksene (Manual PDF / Audio) */
      [class*="FileWidget"] {
        padding: 8px 12px !important;
        min-height: auto !important;
      }
      [class*="FileWidget"] button {
        padding: 4px 10px !important;
        font-size: 0.7rem !important;
        margin-bottom: 4px !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Behold den store, fete overskriften i toppmenyen
      setInterval(() => {
        const links = document.querySelectorAll('a, span, button');
        links.forEach((el) => {
          if (
            el.children.length === 0 &&
            el.textContent &&
            el.textContent.includes('UKIAMKA')
          ) {
            const target = el.closest('a') || el;
            target.style.setProperty('position', 'fixed', 'important');
            target.style.setProperty('top', '10px', 'important');
            target.style.setProperty('left', '50%', 'important');
            target.style.setProperty('transform', 'translateX(-50%)', 'important');
            target.style.setProperty('font-size', '1.40rem', 'important');
            target.style.setProperty('font-weight', '800', 'important');
            target.style.setProperty('letter-spacing', '0.02em', 'important');
            target.style.setProperty('color', '#1e3a8a', 'important');
            target.style.setProperty('white-space', 'nowrap', 'important');
            target.style.setProperty('z-index', '9999', 'important');
          }
        });
      }, 300);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>UKIAMKA Digital documents Library – Admin</title>
    <style>
      /* Style the top navigation bar background */
      #nc-root header,
      [class*="AppHeader"] {
        background-color: #1e3a8a !important;
      }

      /* Make top bar icons and text light so they contrast with the blue background */
      #nc-root header button,
      #nc-root header a,
      [class*="AppHeader"] button,
      [class*="AppHeader"] a {
        color: #ffffff !important;
      }

      /* Center, enlarge, and bolden the main library title link */
      a[href*="ukiamka-docs.pages.dev"] {
        position: fixed !important;
        top: 10px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        font-size: 1.65rem !important;
        font-weight: 800 !important;
        letter-spacing: 0.02em !important;
        color: #ffffff !important;
        text-decoration: none !important;
        white-space: nowrap !important;
        z-index: 9999 !important;
      }

      a[href*="ukiamka-docs.pages.dev"]:hover {
        text-decoration: underline !important;
      }

      /* Adjust for smaller screens so it never overlaps buttons */
      @media (max-width: 900px) {
        a[href*="ukiamka-docs.pages.dev"] {
          position: static !important;
          transform: none !important;
          font-size: 1.15rem !important;
          font-weight: 800 !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>

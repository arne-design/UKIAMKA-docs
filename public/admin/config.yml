backend:
  name: github
  repo: arne-design/UKIAMKA-docs
  branch: main
  base_url: https://UKIAMKA-docs.pages.dev
  auth_endpoint: api/auth

publish_mode: editorial_workflow

media_folder: "public/filer"
public_folder: "/filer"

collections:
  - name: "kurs"
    label: "Kurs og veiledninger"
    folder: "src/content/kurs"
    create: true
    slug: "{{language}}-{{slug}}"
    fields:
      - { label: "Kurstittel", name: "title", widget: "string", required: true }
      - label: "Språk"
        name: "language"
        widget: "select"
        options:
          - { label: "Engelsk", value: "en" }
          - { label: "Swahili", value: "sw" }
          - { label: "Fransk", value: "fr" }
        default: "en"
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Pastorer og eldste"
          - "Ungdomsledere"
          - "Søndagsskole"
          - "Menighetsplanting"
      - { label: "Kort sammendrag", name: "description", widget: "text" }
      - { label: "Kurshefte (PDF)", name: "pdf_file", widget: "file", required: false }
      - { label: "Lydopptak (MP3)", name: "audio_file", widget: "file", required: false }
      - { label: "Filstørrelse (f.eks. 1,4 MB)", name: "file_size", widget: "string", required: false }
      - { label: "Publiseringsdato", name: "date", widget: "datetime" }
      - { label: "Kurstekst", name: "body", widget: "markdown", required: false }

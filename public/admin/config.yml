backend:
  name: github
  repo: arne-design/UKIAMKA-docs
  branch: main
  base_url: https://ukiamka-docs.pages.dev
  auth_endpoint: api/auth
  auth_scope: repo

publish_mode: editorial_workflow

media_folder: "public/filer"
public_folder: "/filer"

collections:
  - name: "kurs"
    label: "Trainings & Course"
    folder: "src/content/kurs"
    create: true
    slug: "{{language}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "Language"
        name: "language"
        widget: "select"
        options:
          - { label: "Engelsk", value: "EN" }
          - { label: "Swahili", value: "SW" }
          - { label: "Amharic", value: "AM" }
          - { label: "Fransk", value: "FR" }
        default: "EN"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Pastors & Leaders"
          - "Youth leaders"
          - "Sunday School"
          - "Church Planting"
      - { label: "Short Summary", name: "description", widget: "text" }
      - { label: "Manual (PDF)", name: "pdf_file", widget: "file", required: false }
      - { label: "Recording (MP3)", name: "audio_file", widget: "file", required: false }
      - { label: "File size (f.eks. 1,4 MB)", name: "file_size", widget: "string", required: false }
      - { label: "Publication date", name: "date", widget: "datetime" }
      - { label: "Manual Text", name: "body", widget: "markdown", required: false }
